<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>The Ink Home</title>
    <script>
      (function () {
        var path = window.location.pathname;
        if (path && path !== '/' && path !== '') {
          window.location.replace('/?redirect_to=' + encodeURIComponent(path));
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="/">home page</a>...</p>
  </body>
</html>
